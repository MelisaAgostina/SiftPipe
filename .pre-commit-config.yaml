repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: frontend-lint
        name: eslint (ui/)
        entry: bash -c 'cd ui && npm run lint'
        language: system
        files: ^ui/
        pass_filenames: false
