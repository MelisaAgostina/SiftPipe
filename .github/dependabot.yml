# Scheduled version-update PRs, limited to minor and patch releases. Major
# versions are ignored on purpose: each one can break the build or the deploy
# path (the AWS auth action, the Anthropic SDK) and needs a deliberate, tested
# upgrade rather than a weekly PR. Security alerts and security-update PRs are
# switched on in the repo's GitHub settings and are not affected by this file,
# so a vulnerable dependency still gets a PR even across a major version.
#
# The github-actions entry also keeps the commit-SHA pins in .github/workflows/
# fresh: Dependabot understands the `@<sha> # vX.Y.Z` form and bumps both.
#
# sidecar/requirements.txt is deliberately not listed yet - it is tracked
# separately with the rest of the sidecar hardening.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # @tanstack/react-start >= 1.169.4 declares an optional peer of vite >= 8,
      # but the UI is deliberately on vite 7 (the @lovable.dev/vite-tanstack-config
      # bump that unlocks vite 8 is deferred). Letting the group PR pull it in makes
      # `npm ci` fail with ERESOLVE. Remove these two entries when vite 8 is adopted.
      - dependency-name: "@tanstack/react-start"
      - dependency-name: "vite"
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    # github/codeql-action/init and /analyze must always run the same version
    # (CodeQL warns and the Analyze jobs fail otherwise). Without a group,
    # Dependabot opens one PR per action, so each PR leaves the pair mismatched.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
