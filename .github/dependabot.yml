# Scheduled version-update PRs. (Security alerts and security-update PRs are
# switched on in the repo's GitHub settings and need no file.) The
# github-actions entry also keeps the commit-SHA pins in .github/workflows/
# fresh: Dependabot understands the `@<sha> # vX.Y.Z` form and bumps both.
#
# sidecar/requirements.txt is deliberately not listed yet - it is tracked
# separately with the rest of the sidecar hardening.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/ui"
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
