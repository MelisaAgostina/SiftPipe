name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Test (unittest)
        run: python -m unittest discover -s tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - run: npm ci
      - run: npm run lint
      # `vite build` strips types without checking them, so this is the only
      # step that would catch a type error before it merges.
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  audit:
    # Known-vulnerability scan of the dependencies, separate from lint/test so
    # a newly published advisory (which can appear any day with no code change)
    # is a distinct red job rather than a confusing failure in the test jobs.
    # Python is pinned in requirements.txt but has no lockfile for transitive
    # packages, so this is also the only thing that looks at those.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      # Gated at "critical" for now: as of 2026-09-28 the tree has 10 "high"
      # findings, all in the Cloudflare/wrangler build tooling (undici), whose
      # only auto-fix is a pre-release miniflare that breaks `npm ci`. Lower
      # this to "high" once wrangler ships a stable release with the fix.
      - name: Audit frontend dependencies (npm audit)
        working-directory: ui
        run: npm audit --audit-level=critical

  docker-smoke:
    # Boots the *entire* compose stack (mattermost, postgres, naviq,
    # siftpipe-api, sidecar, caddy) on the runner and asserts every service
    # that has a HEALTHCHECK actually reaches "healthy" - catches the class
    # of bug that only ever showed up live (ALLOWED_HOSTS, venv ownership,
    # the healthcheck grace period, compose var interpolation), before a
    # merge instead of after one. Real NaViQ (naviq-src/, gitignored) is
    # never present on this runner, so NAVIQ_SRC_PATH points at
    # test-fixtures/naviq-stub instead - see its README.md for what that
    # does and does not verify. No Anthropic API key is ever used for real:
    # nothing here runs the actual B1-B9 pipeline, only container boot.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # submodules: true - mattermost-src/mattermost (.gitmodules) is a real
      # git submodule; actions/checkout skips submodules by default, which
      # would leave siftpipe-api's `COPY mattermost-src/ ./mattermost-src/`
      # copying an empty directory - exactly the class of build-context bug
      # this job exists to catch, so it can't skip fetching it.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true

      - name: Write synthetic .env files (placeholders only, nothing here is called for real)
        run: |
          cp .env.example .env
          cp mattermost/.env.example mattermost/.env

      - name: docker compose config (catches interpolation/YAML errors for free)
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: ./deploy.sh config >/dev/null

      - name: Bring the stack up
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: ./deploy.sh up

      - name: Wait for siftpipe-api and naviq healthchecks
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: |
          wait_healthy() {
            local service="$1" timeout="${2:-240}" waited=0 cid status
            cid="$(./deploy.sh ps -q "$service")"
            [ -n "$cid" ] || { echo "$service: no container" >&2; return 1; }
            while true; do
              status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || echo unknown)"
              [ "$status" = "healthy" ] && { echo "$service: healthy (${waited}s)"; return 0; }
              [ "$waited" -ge "$timeout" ] && { echo "$service: still '$status' after ${timeout}s" >&2; return 1; }
              sleep 5
              waited=$((waited + 5))
            done
          }
          wait_healthy siftpipe-api
          wait_healthy naviq

      - name: Hit the API's own health endpoint
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: |
          ./deploy.sh exec -T siftpipe-api python3 -c "import urllib.request, sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=5).status == 200 else 1)"

      - name: Dump logs on failure
        if: failure()
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: ./deploy.sh logs --no-color --tail=200

      - name: Tear down
        if: always()
        env:
          NAVIQ_SRC_PATH: ${{ github.workspace }}/test-fixtures/naviq-stub
        run: ./deploy.sh down
